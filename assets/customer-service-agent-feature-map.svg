<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">完整示例的功能说明图</title>
  <desc id="desc">三个功能面板分别说明论文结构、术语与引文跳转、响应式阅读与 A4 打印。</desc>
  <rect width="1200" height="540" fill="#e8edef"/>
  <text x="80" y="70" font-family="Georgia, Songti SC, STSong, serif" font-size="29" font-weight="700" fill="#1b2633">完整样稿中可直接体验的三项能力</text>
  <text x="80" y="103" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#617184">功能图解释交互与排版；完整长图及在线页面展示实际报告。</text>
  <g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
    <g transform="translate(80,145)"><rect width="325" height="328" fill="#fff" stroke="#cbd5d9"/><rect width="325" height="6" fill="#174c67"/><text x="25" y="48" font-size="18" font-weight="700" fill="#173c52">01　论文结构</text><text x="25" y="79" font-size="13" fill="#617184">从研究问题到可复核结论</text><rect x="25" y="108" width="275" height="34" fill="#f2f6f7"/><text x="42" y="131" font-size="12" fill="#174c67">摘要 · 关键词 · 目录</text><line x1="25" y1="163" x2="300" y2="163" stroke="#cbd5d9"/><text x="25" y="193" font-size="13" font-weight="700" fill="#384957">背景 → 框架 → 分析</text><text x="25" y="219" font-size="13" font-weight="700" fill="#384957">风险 → 启示 → 结论</text><rect x="25" y="248" width="275" height="47" fill="#eaf0f2"/><text x="42" y="277" font-size="12" fill="#173c52">表格与机制图用于展示关系</text></g>
    <g transform="translate(438,145)"><rect width="325" height="328" fill="#fff" stroke="#cbd5d9"/><rect width="325" height="6" fill="#a17838"/><text x="25" y="48" font-size="18" font-weight="700" fill="#173c52">02　术语与证据</text><text x="25" y="79" font-size="13" fill="#617184">阅读中的跳转与可追溯性</text><text x="25" y="124" font-size="14" fill="#384957">正文中的</text><text x="91" y="124" font-size="14" font-weight="700" fill="#174c67">最小权限</text><line x1="91" y1="129" x2="161" y2="129" stroke="#174c67" stroke-dasharray="3 3"/><text x="171" y="124" font-size="12" fill="#174c67">→ 术语释义</text><text x="25" y="172" font-size="14" fill="#384957">编号引文 [1]</text><text x="139" y="172" font-size="12" fill="#174c67">→ 参考文献</text><rect x="25" y="206" width="275" height="72" fill="#f8f6f1"/><text x="42" y="234" font-size="12" fill="#6b532b">术语首次出现时简释；</text><text x="42" y="257" font-size="12" fill="#6b532b">事实主张在附近给出来源。</text></g>
    <g transform="translate(796,145)"><rect width="325" height="328" fill="#fff" stroke="#cbd5d9"/><rect width="325" height="6" fill="#174c67"/><text x="25" y="48" font-size="18" font-weight="700" fill="#173c52">03　阅读与打印</text><text x="25" y="79" font-size="13" fill="#617184">同一 HTML 适配不同媒介</text><rect x="25" y="111" width="158" height="111" fill="#f2f6f7" stroke="#cbd5d9"/><text x="44" y="143" font-size="12" font-weight="700" fill="#173c52">桌面阅读</text><text x="44" y="168" font-size="11" fill="#617184">约 900–1100px</text><text x="44" y="190" font-size="11" fill="#617184">表格与图示清晰</text><rect x="205" y="111" width="72" height="111" fill="#fff" stroke="#cbd5d9"/><text x="216" y="145" font-size="10" fill="#173c52">窄屏</text><text x="216" y="167" font-size="10" fill="#617184">纵向图示</text><text x="216" y="188" font-size="10" fill="#617184">表格可访问</text><rect x="25" y="249" width="252" height="45" fill="#eaf0f2"/><text x="42" y="278" font-size="12" fill="#173c52">A4：页边距、分页与灰度可读性</text></g>
  </g>
</svg>
