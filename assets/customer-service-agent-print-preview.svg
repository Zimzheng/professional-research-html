<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">桌面、窄屏与 A4 打印版式预览</title>
  <desc id="desc">同一研究报告在桌面阅读、移动窄屏和双页 A4 打印中的版式示意。</desc>
  <rect width="1200" height="720" fill="#e8edef"/>
  <text x="80" y="76" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#9a743b">03 · RESPONSIVE AND PRINT-READY DELIVERY</text>
  <text x="80" y="121" font-family="Georgia, Songti SC, STSong, serif" font-size="28" font-weight="700" fill="#1b2633">同一份报告，在阅读与打印场景中保持结构清晰</text>
  <rect x="80" y="159" width="545" height="470" rx="4" fill="#fff" stroke="#cbd5d9"/>
  <rect x="80" y="159" width="545" height="34" rx="4" fill="#174c67"/>
  <circle cx="106" cy="176" r="6" fill="#d8e6e9"/><circle cx="127" cy="176" r="6" fill="#d8e6e9"/><circle cx="148" cy="176" r="6" fill="#d8e6e9"/>
  <text x="188" y="181" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#fff">Desktop reading · 约 1000px 内容宽度</text>
  <rect x="117" y="222" width="471" height="4" fill="#174c67"/>
  <text x="117" y="263" font-family="Georgia, Songti SC, STSong, serif" font-size="23" font-weight="700" fill="#1b2633">面向客服知识库的 AI 助手</text>
  <rect x="117" y="288" width="471" height="75" fill="#f2f6f7"/>
  <text x="137" y="318" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" fill="#174c67">摘要</text>
  <text x="137" y="342" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#384957">论文结构、证据标注与阅读体验在一个独立文件中交付。</text>
  <rect x="117" y="389" width="471" height="34" fill="#eaf0f2"/>
  <text x="136" y="411" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#173c52">配置对象</text><text x="321" y="411" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="700" fill="#173c52">治理要点</text>
  <rect x="117" y="423" width="471" height="35" fill="#fff" stroke="#d9e1e4"/><rect x="117" y="458" width="471" height="35" fill="#f8fafb" stroke="#d9e1e4"/>
  <text x="136" y="446" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#384957">调用资格</text><text x="321" y="446" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#384957">角色与场景边界</text>
  <text x="136" y="481" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#384957">审计记录</text><text x="321" y="481" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#384957">请求与资料版本</text>
  <text x="117" y="550" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#617184">窄屏：表格横向可访问，机制图纵向排列。</text>
  <rect x="731" y="159" width="158" height="470" fill="#fff" stroke="#cbd5d9"/>
  <rect x="731" y="159" width="158" height="28" fill="#174c67"/>
  <text x="749" y="178" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="10" fill="#fff">NARROW SCREEN</text>
  <rect x="752" y="210" width="116" height="4" fill="#174c67"/>
  <text x="752" y="244" font-family="Georgia, Songti SC, STSong, serif" font-size="15" font-weight="700" fill="#1b2633">客服知识库</text><text x="752" y="267" font-family="Georgia, Songti SC, STSong, serif" font-size="15" font-weight="700" fill="#1b2633">AI 助手</text>
  <rect x="752" y="288" width="116" height="74" fill="#f2f6f7"/><text x="762" y="315" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="9" fill="#384957">摘要与关键词</text><text x="762" y="334" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="9" fill="#384957">保持可读性</text>
  <rect x="752" y="387" width="116" height="50" fill="#fff" stroke="#aebfc7"/><rect x="752" y="445" width="116" height="50" fill="#fff" stroke="#aebfc7"/><rect x="752" y="503" width="116" height="50" fill="#fff" stroke="#aebfc7"/>
  <text x="770" y="418" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="9" fill="#173c52">请求者</text><text x="770" y="476" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="9" fill="#173c52">工作区</text><text x="770" y="534" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="9" fill="#173c52">审计记录</text>
  <rect x="958" y="159" width="162" height="230" fill="#fff" stroke="#b9c6ca"/>
  <rect x="981" y="184" width="116" height="3" fill="#174c67"/>
  <text x="981" y="214" font-family="Georgia, Songti SC, STSong, serif" font-size="12" font-weight="700" fill="#1b2633">研究报告</text>
  <rect x="981" y="230" width="116" height="42" fill="#f2f6f7"/><line x1="981" y1="290" x2="1097" y2="290" stroke="#cbd5d9"/><line x1="981" y1="309" x2="1097" y2="309" stroke="#cbd5d9"/><line x1="981" y1="328" x2="1097" y2="328" stroke="#cbd5d9"/>
  <rect x="958" y="419" width="162" height="210" fill="#fff" stroke="#b9c6ca"/>
  <rect x="981" y="443" width="116" height="3" fill="#174c67"/><text x="981" y="474" font-family="Georgia, Songti SC, STSong, serif" font-size="12" font-weight="700" fill="#1b2633">术语与参考文献</text>
  <line x1="981" y1="495" x2="1097" y2="495" stroke="#cbd5d9"/><line x1="981" y1="514" x2="1097" y2="514" stroke="#cbd5d9"/><line x1="981" y1="533" x2="1097" y2="533" stroke="#cbd5d9"/><line x1="981" y1="552" x2="1097" y2="552" stroke="#cbd5d9"/>
  <text x="958" y="655" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#617184">A4 打印：页边距、分页与灰度可读性。</text>
</svg>
